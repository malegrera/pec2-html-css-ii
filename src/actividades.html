<!doctype html>

<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />
  <!-- do not remove this line! -->
  <title>Jornadas de Artesanía | Actividades</title>
</head>

<body>
  <include src="./views/header.html"></include>
  <main class="actividades">

    <!-- TALLERES -->
    <section class="actividades__talleres">
      <h1>Talleres artesanales</h1>
      <p>Explora las actividades prácticas de las jornadas.</p>

      <div class="actividades__grid">
        <article class="actividades-card">
          <img src="./assets/images/g1.jpg" alt="">
          <h2>Cerámica</h2>
          <p>Modelado y cocción tradicional.</p>
        </article>

        <article class="actividades-card">
          <img src="./assets/images/g2.jpg" alt="">
          <h2>Forja</h2>
          <p>Trabajo artesanal con metales.</p>
        </article>

        <article class="actividades-card">
          <img src="./assets/images/g3.jpg" alt="">
          <h2>Textil</h2>
          <p>Tejido manual con fibras naturales.</p>
        </article>

        <article class="actividades-card">
          <img src="./assets/images/g4.jpg" alt="">
          <h2>Madera</h2>
          <p>Carpintería tradicional.</p>
        </article>

      </div>
    </section>

    <!-- Galería de imágenes -->
    <section class="actividades__galeria">
      <h2>Galería</h2>

      <div id="galeriaCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- indicadores -->
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#galeriaCarousel" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#galeriaCarousel" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#galeriaCarousel" data-bs-slide-to="2"></button>
          <button type="button" data-bs-target="#galeriaCarousel" data-bs-slide-to="3"></button>
          <button type="button" data-bs-target="#galeriaCarousel" data-bs-slide-to="4"></button>

        </div>

        <!-- slides -->
        <div class="carousel-inner">

          <div class="carousel-item active">
            <img src="./assets/images/ceramica.jpg" class="d-block w-100" alt="Artesanía 1">
          </div>

          <div class="carousel-item">
            <img src="./assets/images/forja.jpg" class="d-block w-100" alt="Artesanía 2">
          </div>

          <div class="carousel-item">
            <img src="./assets/images/textil.jpg" class="d-block w-100" alt="Artesanía 3">
          </div>

          <div class="carousel-item">
            <img src="./assets/images/madera.jpg" class="d-block w-100" alt="Artesanía 4">
          </div>

        </div>

        <!-- controles -->
        <button class="carousel-control-prev" type="button" data-bs-target="#galeriaCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#galeriaCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>

      </div>
    </section>

    <!-- Formulario de contacto -->
    <section class="actividades__contacto">
      <h2>Contacto</h2>

      <form name="contacto" method="post" data-netlify="true" class="actividades__form">
        <input class="form-control" type="hidden" name="form-name" value="contacto">

        <input class="form-control" type="text" name="nombre" placeholder="Nombre" required>
        <input class="form-control" type="email" name="email" placeholder="Email" required>
        <textarea class="form-control" name="mensaje" placeholder="Mensaje" required></textarea>

        <button class="btn btn-primary w-100">Enviar</button>
      </form>
    </section>

  </main>
  <include src="./views/footer.html"></include>
  <script type="module" src="./assets/scripts/main.js"></script>
  <!-- do not remove this line! -->
</body>

</html>
